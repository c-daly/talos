version: '3.9'
networks:
  default:
    name: logos-test-network
    driver: bridge
volumes:
  talos_test_neo4j_data: {}
  talos_test_neo4j_logs: {}
  talos_test_milvus_etcd: {}
  talos_test_milvus_minio: {}
  talos_test_milvus: {}
services:
  neo4j:
    container_name: talos-test-neo4j
    image: neo4j:5.14.0
    ports:
    - 57474:7474
    - 57687:7687
    environment:
    - NEO4J_AUTH=neo4j/neo4jtest
    - NEO4J_PLUGINS=["apoc","n10s"]
    - NEO4JLABS_PLUGINS=["apoc","n10s"]
    - NEO4J_dbms_security_procedures_unrestricted=apoc.*,n10s.*
    - NEO4J_dbms_security_procedures_allowlist=apoc.*,n10s.*
    - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
    - talos_test_neo4j_data:/data
    - talos_test_neo4j_logs:/logs
    healthcheck:
      test:
      - CMD
      - cypher-shell
      - -u
      - neo4j
      - -p
      - neo4jtest
      - RETURN 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - default
  milvus:
    container_name: talos-test-milvus
    image: milvusdb/milvus:v2.4.15
    command:
    - milvus
    - run
    - standalone
    environment:
    - ETCD_ENDPOINTS=milvus-etcd:2379
    - MINIO_ADDRESS=milvus-minio:9000
    depends_on:
    - milvus-etcd
    - milvus-minio
    volumes:
    - talos_test_milvus:/var/lib/milvus
    ports:
    - 57530:19530
    - 57091:9091
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
    - default
