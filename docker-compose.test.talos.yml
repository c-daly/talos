version: '3.9'

services:
  test-runner:
    image: ghcr.io/c-daly/logos-foundry:0.1.0
    container_name: talos-test-runner
    working_dir: /app/talos
    environment:
      - PYTHONPATH=/app:/app/talos/src
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jtest
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
    volumes:
      - ../talos:/app/talos
    command: >
      sh -c "
        cd /app/talos &&
        poetry install --no-root --only main &&
        poetry run pytest -v
      "
    depends_on:
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - logos-test-network

networks:
  logos-test-network:
    external: true
