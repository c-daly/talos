[tool.poetry]
name = "talos"
version = "0.1.0"
description = "Sensor/actuator abstraction layer for Project LOGOS"
authors = ["Project LOGOS Team"]
license = "MIT"
readme = "README.md"
keywords = ["hardware-abstraction", "sensors", "actuators", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "talos", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0.0"
numpy = "^1.24.0"
neo4j = "^5.14.0"
pymilvus = "^2.3.0"
# Pinned to specific tag for stability
logos-foundry = {git = "https://github.com/c-daly/logos.git", tag = "v0.4.2"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = ">=0.21,<1.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["logos_config", "logos_config.*", "logos_test_utils", "logos_test_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=talos --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60"
asyncio_mode = "auto"
markers = [
    "unit: fast tests with no external services",
    "integration: tests requiring infrastructure services (Neo4j, Milvus)",
    "e2e: end-to-end tests requiring full stack",
    "slow: marks tests as slow",
]
