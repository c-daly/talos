name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  pr-checks:
    if: github.event_name == 'pull_request'
    uses: c-daly/logos/.github/workflows/reusable-pr-checks.yml@ci/v2
    with:
      require_issue_linkage: false

  standard:
    uses: c-daly/logos/.github/workflows/reusable-standard-ci.yml@ci/v2
    with:
      check_foundry_alignment: true
      python_versions: '["3.12"]'
      python_package_manager: 'poetry'
      python_command_prefix: 'poetry run '
      poetry_install_args: '--with dev'
      python_lint_paths: 'src tests'
      mypy_targets: 'src'
      pytest_command: 'pytest --cov=talos --cov-report=term-missing --cov-report=xml --cov-fail-under=60'
      coverage_python_version: '3.12'
      upload_coverage: false
